<!DOCTYPE html>
<html>
    <head>
        <title>PRIW Gmail Signup Page </title>
    </head>
    <body>
        <form action="+1"method="post">
            <center>
                <h1 style=text-decoration:"under-line">
                    Gmail Signup Page </h1>
                    <label> Name:</label>
                    <input type="text" placeholder="First">
                    <input type="text" placeholder="Last">
                    <br>
                     <br>
                <label> choose your username:</label>
                <input type="text">
                <br>
                <br>
                <label> create password:</label>
                <input type="password">
                <br>
                <br>
                <label> confirm password:</label>
                <input type="password">
                <br>
                <br>
                <label>Birthday:</label>
                <select>
                    <option> Jan </option>
                    <option> Feb </option>
                    <option> March </option>
                    <option> April </option>
                    <option> May </option>
                    <option> June </option>
                    <option> July </option>
                    <option> Aug </option>
                    <option> Sep </option>
                    <option> Oct </option>
                    <option> Nov </option>
                    <option> Dec </option>
                </select>
                 <input type="text" placeholder="Day">
                  <input type="text" placeholder="Year">
                  <br>
                  <br>
                  <label> Gender:</label>
                  <select>
                    <option> Male </option>
                    <option> FeMale </option>
                    <option> other </option>
                  </select>
                  <br>
                  <br>
                  <input type="submit" value="Signup">
                  <input type="reset" value="clear">
            </center>
        </form>
    </body>
</html>
