<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset ="UTF-8">
        <meta name ="viewport" content ="width=device-width,initial-scale=1.0">
    <title>Registration form 
    </title> 
    <style>
        body
        {
             font-family:Arial,sans-serif;background-color: #f0f0f0;
         }
         container
         {
            max-width: 400px;margin:40px auto;padding:20px;background-color:#fff ;border:1px solid #ddd;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,1) ; 
         }
        lable{
            display:block;margin-bottom: auto 10px;
        }
        input[type="tect"],input[tyoe="email"],input[type="password"]
        {
            width:93%;height:40px;padding:10px;border:1px solid #ccc;border-radius:5px;
        }
        button[type="submit"]
        {
            width:100%; height:40px;background: color #4caf50;color: #fff;padding:10px;border:none;border-radius:5px ;cursor: pointer;
        }
        button[tyoe="submit"]:hover
        {
            background: color #3e8e41;
         }
    </style> 
  </head>
  <body>
    <div class="container">
        <center><h2><u>REGISTRATION FORM </u></h2></center>
        <form>
            <div class="form-group">
                <label for="first name"> first Name:</label>
                <input type="text" id="first name" name="first name"required>
            </div>
            <div class="form-group">
                <label for="last name"> last Name:</label>
                <input type="text" id="last name" name="last name"required>
            </div>
            <div class="form-group">
                <lable for="phonenum"> phone number:</lable>
                <input type="text" id="phonenum" name="phonenum" required>
            </div>
            <div class="form-group">
                <lable for="email"> Email:</lable>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <lable for="password"> password:</lable>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <lable for="confirm password"> confirm password:</lable>
                <input type="password" id="confirm password" name="confirm password" required>
            </div>
            
        </form>
    </div>
  </body>
</html>
